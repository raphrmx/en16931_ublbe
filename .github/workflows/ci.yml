name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Catches SDK drift on a package that can go months without a commit: a new
  # formatter default or a new lint shows up here rather than on the next release.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        sdk: [stable, beta]

    # The beta leg is an early warning, not a gate.
    continue-on-error: ${{ matrix.sdk == 'beta' }}

    name: ${{ matrix.sdk }}

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      # Language features are gated by the pubspec lower bound, so this also
      # guards the declared Dart floor.
      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Run tests
        run: dart test

      # The example is part of the package and compiles against it, so a model
      # change that breaks it is caught here rather than by a reader.
      - name: Run the example
        run: dart run example/example.dart

      # Fails on a packaging regression, such as a CHANGELOG that no longer
      # mentions the version in pubspec.yaml.
      - name: Validate the package
        run: dart pub publish --dry-run

  # The artefact is pinned, so this fails only when the pinned zip no longer
  # hashes as it did, or when the generator no longer reads it the same way.
  # A new UBL.BE release shows up in the examples job below first. It does not
  # run on a push, so the build never depends on the network, and the
  # artefact is read and thrown away.
  artefacts:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: artefacts

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Read the published artefacts
        run: dart run tool/generate_catalogue.dart --fetch

      - name: The catalogue is current
        run: git diff --exit-code -- lib/src/catalogue.g.dart

  # The test cases UBL.BE publishes, read from the newest release the mirror
  # holds rather than the pinned one, so that a release which changes what a
  # valid invoice looks like turns this red. They found two faults in the
  # package this one writes with. They are fetched here and never committed.
  examples:
    runs-on: ubuntu-latest
    name: published examples

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Fetch the published examples
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: dart run tool/fetch_examples.dart

      - name: Check them
        run: dart test test/ublbe_examples_test.dart
