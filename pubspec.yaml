version: 0.1.2
homepage: https://comapps.web.app/#en16931_ublbe
repository: https://github.com/raphrmx/en16931_ublbe
issue_tracker: https://github.com/raphrmx/en16931_ublbe/issues
topics:
  - einvoicing
  - en16931
  - ubl
  - invoice
  - vat

environment:
  sdk: ^3.3.0

dependencies:
  decimal: ^3.2.6
  en16931: ^0.1.4
  en16931_peppol: ^0.1.4
  en16931_ubl: ^0.1.6
  xml: '>=6.5.0 <8.0.0'

dev_dependencies:
  archive: ^4.0.0
  crypto: ^3.0.0
  lint: ^2.4.0
  test: ^1.25.7
