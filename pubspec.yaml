  - en16931
  - ubl
  - invoice
  - vat

environment:
  sdk: ^3.11.0

dependencies:
  decimal: ^3.2.6
  en16931: ^0.1.2
  en16931_peppol: ^0.1.2
  en16931_ubl: ^0.1.4
  xml: ^7.0.0

dev_dependencies:
  archive: ^4.0.0
  crypto: ^3.0.0
  lint: ^2.4.0
  test: ^1.25.7
