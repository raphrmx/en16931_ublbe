name: en16931_ublbe
description: >-
  The UBL.BE profile of the European electronic invoice: the identifier it is
  claimed under, the rules Belgium adds to EN 16931, and the Belgian terms UBL
  carries beyond it.
version: 0.1.5
homepage: https://packages.comapps.be/#en16931_ublbe
repository: https://github.com/raphrmx/en16931_ublbe
issue_tracker: https://github.com/raphrmx/en16931_ublbe/issues
funding:
  - https://www.paypal.com/donate/?hosted_button_id=ZN6D382YQAV5N
topics:
  - einvoicing
  - en16931
  - ubl
  - invoice
  - vat
screenshots:
  - description: Which packages to add for a Peppol, UBL.BE, XRechnung or Factur-X invoice, and what each one writes.
    path: screenshots/situations.png

environment:
  sdk: ^3.3.0

dependencies:
  decimal: ^3.2.6
  en16931: ^0.1.6
  en16931_peppol: ^0.2.0
  en16931_ubl: ^0.1.8
  xml: ^7.1.0

dev_dependencies:
  archive: ^4.6.0
  crypto: ^3.0.8
  lint: ^2.4.0
  test: ^1.25.7
